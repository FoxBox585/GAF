services:
  - type: worker
    name: gaf
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/gaf.db
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: JOKER_BOT_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ALLOWED_CHAT_ID
        sync: false
